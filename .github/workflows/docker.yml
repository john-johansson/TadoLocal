name: Docker

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
    paths:
      - 'tado_local/**'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'setup.py'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push to Quay.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from __version__.py
        id: version
        run: |
          VERSION=$(python -c "import re; m = re.search(r'__version__\s*=\s*[\"\'](.*?)[\"\']', open('tado_local/__version__.py').read()); print(m.group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/john_johansson/tadolocal
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/feature/') }}

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
